[project]
name = "lumina-saver"
version = "1.0.0"
description = "Modern high-performance cross-platform photo and video screensaver & slideshow viewer for large collections (60,000+ files)"
authors = [
    { name = "LuminaSaver Contributors" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "python-mpv>=1.0.5",
    "Pillow>=10.2.0",
    "pillow-heif>=0.16.0",
    "piexif>=1.1.3",
    "av>=11.0.0",
    "watchdog>=4.0.0",
]

[project.scripts]
lumina-saver = "lumina_saver.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
