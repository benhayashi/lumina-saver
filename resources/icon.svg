<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="256" height="256" rx="56" fill="url(#bg-grad)"/>

  <!-- Outer Glow Frame -->
  <rect x="36" y="44" width="184" height="152" rx="20" fill="none" stroke="url(#frame-grad)" stroke-width="6" filter="url(#glow)" opacity="0.6"/>
  <rect x="36" y="44" width="184" height="152" rx="20" fill="none" stroke="url(#frame-grad)" stroke-width="4"/>

  <!-- Mountain Silhouette (Photo symbol) -->
  <path d="M52 176 L104 116 L144 160 L172 132 L204 176 Z" fill="#334155" opacity="0.7"/>
  <path d="M96 176 L136 128 L168 164 L188 144 L204 176 Z" fill="url(#frame-grad)" opacity="0.4"/>

  <!-- Sun / Ambient Orb -->
  <circle cx="84" cy="88" r="14" fill="#38BDF8" opacity="0.8"/>

  <!-- Lumina Star Sparkle -->
  <path d="M192 68 Q192 84 208 84 Q192 84 192 100 Q192 84 176 84 Q192 84 192 68 Z" fill="url(#star-grad)" filter="url(#glow)"/>
  <path d="M136 52 Q136 60 144 60 Q136 60 136 68 Q136 60 128 60 Q136 60 136 52 Z" fill="#FDE047" opacity="0.9"/>
</svg>
